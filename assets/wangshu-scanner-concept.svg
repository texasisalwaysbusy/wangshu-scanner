      <rect x="252" y="443" width="124" height="41" rx="20" fill="#8de7ce" fill-opacity="0.12" stroke="#8de7ce" stroke-opacity="0.4"/>
      <text x="314" y="469" text-anchor="middle" fill="#b8f3df">OCR / TXT</text>
      <rect x="390" y="443" width="88" height="41" rx="20" fill="#8de7ce" fill-opacity="0.12" stroke="#8de7ce" stroke-opacity="0.4"/>
      <text x="434" y="469" text-anchor="middle" fill="#b8f3df">PDF</text>
    </g>
  </g>
