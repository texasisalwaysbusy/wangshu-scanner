  <path d="M72 545H1368" stroke="#42656c" stroke-opacity="0.65"/>
  <text x="75" y="580" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c2d7d6">原创概念插画 · 非实际界面或测试证据</text>
