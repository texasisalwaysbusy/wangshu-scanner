<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">望舒扫描 · Wangshu Scanner — concept illustration</title>
  <desc id="desc">Original concept illustration showing abstract document pages, crop corners and text lines. No real scans or user content. Not an application screenshot or test evidence. 原创概念插画，非实际界面或测试证据。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2a"/><stop offset="1" stop-color="#123c49"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#d6eee7"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75e8c2" stop-opacity="0.20"/><stop offset="1" stop-color="#75e8c2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="640" rx="28" fill="url(#night)"/>
  <g fill="none" stroke="#34616a" stroke-opacity="0.3">
    <circle cx="1154" cy="240" r="310"/><circle cx="1154" cy="240" r="255"/>
    <path d="M1064 0V570M1310 0V570M760 112H1440M760 454H1440"/>
  </g>
  <!-- Original project mark: crescent and a page corner. -->
  <g transform="translate(72 68)">
    <path d="M44 0A34 34 0 1 0 65 52A30 30 0 0 1 44 0Z" fill="#8de7ce"/>
    <path d="M57 11h16v16M13 50v16h16" fill="none" stroke="#fff3ce" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Inter, DejaVu Sans, Arial, sans-serif">
