    <text x="72" y="226" font-family="Noto Sans CJK SC, sans-serif" font-size="76" font-weight="600" letter-spacing="4" fill="#fffaf0">望舒扫描</text>
    <text x="76" y="290" font-size="43" font-weight="500" letter-spacing="0.4" fill="#e8f3ef">Wangshu Scanner</text>
    <text x="78" y="355" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#b7d3d5">从纸张，到便于审阅和检索的文档。</text>
    <text x="78" y="393" font-size="19" fill="#b7d3d5">From paper to pages you can review and search.</text>
    <g font-size="14" letter-spacing="1.2" font-weight="600">
