plugins { id 'com.android.application' }

android {
    namespace 'org.wangshu.scan'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.wangshu.scan'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.2.4-preview-recovery-verify'
        testInstrumentationRunner 'org.wangshu.scan.ScanInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false }
    }
    lint { abortOnError true }
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation project(':ocrnative')
}
